name: finsport

services:
  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  init-logs:
    image: busybox
    volumes:
      - logs_volume:/app/logs
      - static_volume:/app/staticfiles
    user: "0"
    command: >-
      sh -c "mkdir -p /app/logs /app/staticfiles &&
      chown -R 1000:1000 /app/logs /app/staticfiles"

  db:
    image: postgres:17
    restart: always
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 15

  django-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      init-logs:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - logs_volume:/app/logs
    env_file:
      - .env

  celery:
    build: .
    restart: always
    command: celery -A finsport worker -l info -Q finsport.local.safe
    volumes:
      - .:/app
    depends_on:
      - redis
      - django-web
    env_file:
      - .env

  celery-beat:
    build: .
    restart: always
    command: celery -A finsport beat -l info --schedule=/tmp/finsport-celerybeat-schedule
    volumes:
      - .:/app
    depends_on:
      - redis
      - django-web
    env_file:
      - .env

  nginx:
    image: nginx:1.29
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
    depends_on:
      - django-web

volumes:
  postgres_data:
  static_volume:
  logs_volume:
  redis_data:

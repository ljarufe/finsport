{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Finsport{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'reporting/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'reporting/finsport.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar border-bottom bg-white" aria-label="Navegación principal">
    <div class="container-xl d-flex flex-wrap align-items-center gap-3 py-2">
      <a class="navbar-brand fw-bold text-success mb-0" href="{% url 'reporting-home' %}">FINSPORT</a>
      <div class="d-flex flex-wrap align-items-center gap-3 ms-auto">
        <a class="nav-link" href="{% url 'reporting-home' %}">Inicio</a>
        <a class="nav-link" href="{% url 'reporting-matches' %}">Partidos</a>
        <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
        <a class="nav-link" href="{{ grafana_url }}" target="_blank" rel="noopener noreferrer">Grafana</a>
      </div>
    </div>
  </nav>
  <main class="container-xl py-4 py-md-5">
    {% block content %}{% endblock %}
  </main>
  <footer class="container-xl pb-4 text-muted small">Finsport · simulación local</footer>
  {% block extra_script %}{% endblock %}
</body>
</html>

name: Pull Request Validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run stable repository gate
        env:
          FINSPORT_CI_PROJECT: finsport-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: make ci-check

      - name: Remove scoped CI residue
        if: always()
        env:
          FINSPORT_CI_PROJECT: finsport-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: make ci-clean
